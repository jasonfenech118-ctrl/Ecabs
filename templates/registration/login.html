{% extends "base.html" %}
{% block title %}Sign in — eCabs Claims{% endblock %}
{% block anon_content %}
<div class="card login-card">
  <h1>eCabs Claims</h1>
  {% if form.errors %}
    <p class="errorlist" style="padding-left:0">Your username and password didn't match. Please try again.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" autofocus required>
    </div>
    <div class="field">
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center">Sign in</button>
  </form>
</div>
{% endblock %}
