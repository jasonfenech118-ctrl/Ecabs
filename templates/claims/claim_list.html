{% extends "base.html" %}
{% block title %}Claims — Vai Drive Claims{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Claims</h1>
    <div class="sub">Search by reference, vehicle, third party, policy or location</div>
  </div>
  <div class="row">
    <button type="button" onclick="window.print()" class="btn">🖨 Print</button>
    <a href="{% url 'claim_new' %}" class="btn btn-primary">+ New claim</a>
  </div>
</div>

<div class="card">
  <form method="get" action="{% url 'claim_list' %}" class="toolbar"
        hx-get="{% url 'claim_list' %}"
        hx-target="#claim-results"
        hx-trigger="input changed delay:400ms from:find input, change from:find select"
        hx-push-url="true">
    <input type="search" name="q" value="{{ q }}" placeholder="Search claims…" aria-label="Search claims">
    <select name="status" aria-label="Filter by status" style="max-width:220px">
      <option value="">All statuses</option>
      {% for value, label in statuses %}
        <option value="{{ value }}" {% if value == status %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    <select name="sort" aria-label="Sort by" style="max-width:240px" title="Sort by">
      {% for key, label, _order in sorts %}
        <option value="{{ key }}" {% if key == sort %}selected{% endif %}>Sort: {{ label }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="btn btn-primary">Filter</button>
    {% if q or status %}<a href="{% url 'claim_list' %}" class="btn btn-sm">Clear</a>{% endif %}
  </form>

  <div id="claim-results">
    {% include "claims/partials/claim_results.html" %}
  </div>
</div>
{% endblock %}
