{% extends "base.html" %}
{% block title %}Reminders — eCabs Claims{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Reminders</h1>
    <div class="sub">Follow-ups across all claims</div>
  </div>
</div>

<div class="card">
  <form class="toolbar"
        hx-get="{% url 'reminder_list' %}"
        hx-target="#reminder-rows"
        hx-trigger="change"
        hx-push-url="true">
    <select name="show" style="max-width:200px" aria-label="Filter reminders">
      <option value="open" {% if show == "open" %}selected{% endif %}>Open only</option>
      <option value="all" {% if show == "all" %}selected{% endif %}>All reminders</option>
    </select>
  </form>

  <div class="table-wrap">
    <table class="list">
      <thead>
        <tr><th style="width:2.5rem"></th><th>Reminder</th><th>Claim</th><th>Due</th><th>Assigned</th></tr>
      </thead>
      <tbody id="reminder-rows">
        {% include "claims/partials/reminder_rows.html" %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
